<!doctype html>
<html lang="zh-Hant">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet">
<style>

</head>
<body>
<canvas id="game" aria-label="宣教之路手機直式示意畫面：保羅與同伴、同心合意量表、五旬節 FEVER、升級卡片與失敗彩蛋"></canvas>
<script>
'use strict';
const LW = 180, LH = 320;
const cv = document.getElementById('game'), D = cv.getContext('2d');
const low = document.createElement('canvas'); low.width = LW; low.height = LH;
const L = low.getContext('2d');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W = 405, H = 720, DPR = 1;

const P = {
  ink: '#f4ead2', dark: '#1b1420', outl: '#2a1a14', panel: '#241a2e', bronze: '#c9a46b',
  sandL: '#e3c690', sand: '#d4b27a', rut: '#bf9a62', earth: '#a77f48', earth2: '#b8905a', soil: '#8e6a3d',
  stoneL: '#c8c2b2', stone: '#9a958a', stoneD: '#6a665e',
  leafD: '#3c4a24', leaf: '#5b6b2f', leafM: '#7d8a3c', leafL: '#a9ad74', bark: '#5a3f28', barkL: '#7a5636',
  skin: '#e3a878', gold: '#ffd75e', cream: '#fff4c2', flame: '#ff8a2a', red: '#e8481c',
  vD: '#1a0f24', v: '#3b1e52', vL: '#6b3a8c', vE: '#e9d6ff', sky: '#7ec8e3', heal: '#7be08a'
};

// ---------- rng / noise ----------
let seed = 1337;
function rnd() { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
function hash(x, y) { let h = (x * 374761393 + y * 668265263) | 0; h = Math.imul(h ^ h >>> 13, 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function vn(x, y) {
  const g = 22, ix = Math.floor(x / g), iy = Math.floor(y / g); let fx = x / g - ix, fy = y / g - iy;
  fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
  const a = hash(ix, iy), b = hash(ix + 1, iy), c = hash(ix, iy + 1), d = hash(ix + 1, iy + 1);
  return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
}
const roadY = x => 22 * Math.sin(x * 0.011) + 9 * Math.sin(x * 0.029 + 1);
function R(x, y, w, h, c) { L.fillStyle = c; L.fillRect(x, y, w, h); }
function sprite(w, h, fn) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const col = fn(x, y); if (col) { g.fillStyle = col; g.fillRect(x, y, 1, 1); } }
  return c;
}
function pattern(rows, map) { return sprite(rows[0].length, rows.length, (x, y) => map[rows[y][x]] || null); }

// ---------- scenery ----------
function makeTree(v) {
  seed = v * 977 + 11;
  const w = 36, h = 38, grid = [], blobs = [];
  for (let i = 0; i < 6; i++) blobs.push([18 + (rnd() - .5) * 20, 12 + (rnd() - .5) * 9, 5 + rnd() * 4]);
  const lean = (rnd() - .5) * 2;
  for (let y = 0; y < h; y++) { grid.push([]); for (let x = 0; x < w; x++) grid[y].push(null); }
  for (let y = 16; y < h; y++) {
    const cx = Math.round(18 + Math.sin(y * 0.4 + v) * 1.4 + lean * (h - y) / 10), wd = y > 33 ? 5 : 3;
    for (let k = 0; k < wd; k++) grid[y][cx - (wd >> 1) + k] = k === 0 ? P.barkL : (k === wd - 1 ? P.outl : P.bark);
  }
  for (let i = 0; i < 7; i++) { grid[22 - i][17 - i] = P.bark; grid[22 - i][18 - i] = P.barkL; }
  for (let y = 0; y < 27; y++) for (let x = 0; x < w; x++) {
    let m = 0; for (const b of blobs) m = Math.max(m, 1 - Math.hypot(x - b[0], (y - b[1]) * 1.15) / b[2]);
    if (m <= 0 || hash(x + v * 50, y) < 0.05) continue;
    const l = ((18 - x) * 0.5 + (10 - y) * 0.8) / 14 + m * 0.6 + (hash(x * 3 + v, y * 7) - .5) * 0.5;
    grid[y][x] = m < 0.12 ? P.leafD : l > 0.95 ? P.leafL : l > 0.55 ? P.leafM : l > 0.15 ? P.leaf : P.leafD;
  }
  return sprite(w, h, (x, y) => {
    if (grid[y][x]) return grid[y][x];
    const n = (dx, dy) => grid[y + dy] && grid[y + dy][x + dx] && grid[y + dy][x + dx] !== P.bark && grid[y + dy][x + dx] !== P.barkL;
    return y < 28 && (n(1, 0) || n(-1, 0) || n(0, 1) || n(0, -1)) ? '#26301a' : null;
  });
}
function makeRock(v, w, h) {
  return sprite(w, h, (x, y) => {
    const dx = (x - w / 2 + .5) / (w / 2), dy = (y - h + 1.5) / (h - .5) * (y > h - 3 ? .6 : 1);
    const d = dx * dx + dy * dy * 1.3; if (d > 1) return null;
    if (d > .7 && hash(x + v, y) < .5) return P.stoneD;

}
const trees = [makeTree(1), makeTree(2), makeTree(3)];
const rocks = [makeRock(1, 10, 7), makeRock(2, 7, 5), makeRock(3, 13, 8)];
const bush = sprite(11, 7, (x, y) => { const d = Math.hypot((x - 5) / 5.5, (y - 4) / 3.5); if (d > 1) return null; const l = (5 - x) * .1 + (3 - y) * .25 + hash(x, y) * .4; return d > .8 ? P.leafD : l > .6 ? P.leafM : P.leaf; });
const milestone = pattern(['.ooooo.', 'oLLMMDo', 'oLMMMDo', 'oLMMMDo', 'oLDDDDo', 'oLMMMDo', 'oLMDMDo', 'oLMDMDo', 'oLMMMDo', 'oLDDDDo', 'oLMMMDo', 'oLMMgDo', 'ooggooo'],
  { o: P.stoneD, L: P.stoneL, M: P.stone, D: P.stoneD, g: P.leafM });
const flame = pattern(['..w..', '.wy..', '.yyo.', 'oyyo.', 'oyywo', '.oyo.', '..r..'], { w: P.cream, y: P.gold, o: P.flame, r: P.red });
const headFlame = pattern(['.w.', 'wy.', 'yyo', '.o.'], { w: P.cream, y: P.gold, o: P.flame });
const note = pattern(['..xx', '..x.', '..x.', 'xxx.', 'xx..'], { x: P.gold });
const plus = pattern(['.g.', 'gwg', '.g.'], { g: P.heal, w: P.cream });
const joyIcon = pattern(['.....y.....', '.y...y...y.', '...ggggg...', '..gGGGGGg..', 'y.gGeGeGg.y', '..gGGGGGg..', '..gGeeeGg..', '...ggggg...', '.y...y...y.', '.....y.....'],
  { y: P.cream, g: P.flame, G: P.gold, e: P.outl });
const basket = pattern(['...ooooo...', '..o.yyy.o..', '.bByyyyyBb.', 'obBbBbBbBbo', 'oBbBbBbBbBo', '.obBbBbBbo.', '..ooooooo..'],
  { o: '#5a3f28', b: '#a77f48', B: '#c99a5a', y: '#f0c878' });
const LIGHT = { w: '#ffe9a8', W: '#fffdf2' };
const lightStand = pattern(['...www...', '..wWWWw..', '..wWWWw..', '..wWWWw..', '...www...', '..wwwww..', '.wWWWWWw.', '.wWWWWWw.', 'wwWWWWWww', 'w.wWWWw.w',
  'w.wWWWw.w', '..wWWWw..', '..wWWWw..', '..wWWWw..', '.wWWWWWw.', '.wWWWWWw.', '.wWWWWWw.', 'wWWWWWWWw', 'wwwwwwwww'], LIGHT);
const lightCrouch = pattern(['.....www...', '....wWWWw..', '....wWWWw..', '.....www...', '....wwwww..', '...wWWWWWw.', 'wwwWWWWWWw.', '...wWWWWWWw',
  '...wWWWWWWw', '..wWWWWWWWw', '..wWWWWWWWw', '.wWWWWWWWWw', '.wwwwwwwwww'], LIGHT);

// ---------- characters ----------
const BODY = ['..ooooo..', '.ohhhhho.', 'ohhhhhhho', 'ohsssssho', 'osessseso', '.ossssso.', '.orrbrro.', 'osrrbrrso', 'oRrrbrrRo', 'oRrrrrrRo', 'oRRrrrRRo', '.ooooooo.'];
function buildGrid(c) {
  const g = BODY.map(r => r.split(''));
  if (c.bald) for (let x = 3; x <= 5; x++) { g[1][x] = 's'; g[2][x] = 's'; }
  if (c.beard) { for (let x = 2; x <= 6; x++) g[5][x] = 'd'; if (c.long) { g[6][3] = 'd'; g[6][4] = 'd'; g[6][5] = 'd'; } }
  if (c.veil) { g[5][1] = 'h'; g[6][1] = 'h'; g[5][7] = 'h'; g[6][7] = 'h'; g[3][2] = 'h'; g[3][6] = 'h'; }
  return g.map(r => r.join(''));
}
const cmap = (c, all) => all ? { o: all, h: all, s: all, e: all, r: all, R: all, b: all, d: all } : { o: P.outl, h: c.hair, s: P.skin, e: '#1b1420', r: c.robe, R: c.shade, b: c.belt, d: c.beard };
const CH = [
  { id: 'paul', name: '保羅', hair: '#3a2a20', robe: '#8a5a34', shade: '#5e3b22', belt: '#d9b36a', beard: '#3a2a20', long: 1, bald: 1, home: [0, 0] },
  { id: 'barn', name: '巴拿巴', hair: '#5a3a26', robe: '#4f6fa0', shade: '#344a70', belt: '#e8d9a8', beard: '#6b4a30', long: 1, home: [-20, -11] },
  { id: 'luke', name: '路加', hair: '#2e2420', robe: '#e8e0c8', shade: '#b5ab90', belt: '#5d9c4a', home: [19, -12] },
  { id: 'silas', name: '西拉', hair: '#1f1814', robe: '#a03c3c', shade: '#6e2428', belt: '#ffd75e', beard: '#1f1814', home: [-23, 9] },
  { id: 'tim', name: '提摩太', hair: '#8a5a30', robe: '#e3b04b', shade: '#a87a2a', belt: '#7a4a28', home: [23, 8] },
  { id: 'pri', name: '百基拉', hair: '#e8d9c0', robe: '#a65a8e', shade: '#6f3a60', belt: '#f4ead2', veil: 1, home: [-10, 22] },
  { id: 'aq', name: '亞居拉', hair: '#3a2a20', robe: '#4f7a5a', shade: '#30503a', belt: '#c8a060', beard: '#4a3426', home: [10, 23] }
];
CH.forEach((c, i) => { const g = buildGrid(c); c.spr = pattern(g, cmap(c)); c.white = pattern(g, cmap(c, P.cream)); c.i = i; });
const C = id => CH.find(c => c.id === id);
const paulKneel = (() => { const g = buildGrid(CH[0]).slice(0, 6).map(r => r + '.'); return pattern(g.concat(['.orrbrro..', 'oRrrbrrRRo', 'oRRrrrRRRo', '.oooooooo.']), cmap(CH[0])); })();
const apollos = pattern(buildGrid({ beard: 1 }), { o: P.outl, h: '#2a1e18', s: '#c98c5e', e: '#1b1420', r: '#3f8f8a', R: '#2a605c', b: P.gold, d: '#2a1e18' });

// ---------- state ----------
let mode, U, T, playT, clock, pX, pY, jx, jy, joyOn, camX, camY, meter, btn, btnTapped, fever, feverLen, feverKills, burstR, burstId;
let flash, xp, lv, hp, lvPop, cardShown, cardT, eggT, eggClock, silasLv3, invT, enemyId, spawnT, scatterBy;
let enemies, bolts, parts, rings, gems, embers, heals, taps, pops;
const TYPES = { fear: { sp: 20, hp: 1, name: '懼怕' }, strife: { sp: 12, hp: 3, name: '紛爭' }, lies: { sp: 14, hp: 2, name: '謊言' }, sleep: { sp: 8, hp: 3, name: '沉睡' } };
const JOY = { x: 62, y: 258, r: 17 }, BTN = { x: 90, y: 288 };
function reset() {
  seed = 4242; mode = 'play'; U = 0; T = 0; playT = 0; clock = 416; pX = 40; pY = roadY(40); jx = 0; jy = 0; joyOn = 1;
  meter = 0; btn = -1; btnTapped = 0; fever = -1; feverLen = 8; feverKills = 0; burstR = -1; burstId = 0;
  flash = 0; xp = 14; lv = 7; hp = 1; lvPop = 0; cardShown = 0; cardT = 0; eggT = 0; silasLv3 = 0; invT = 0; enemyId = 0; spawnT = 0;
  scatterBy = { fear: 0, strife: 0, lies: 0, sleep: 0 };
  enemies = []; bolts = []; parts = []; rings = []; gems = []; embers = []; heals = []; taps = []; pops = [];
  CH.forEach(c => Object.assign(c, { bx: pX + c.home[0], by: pY + c.home[1], x: pX, y: pY, ox: 0, oy: 0, vx: 0, vy: 0, cd: .4 + c.i * .37, alert: 0, zz: 0 }));
  setCam();
  for (let i = 0; i < 18; i++) { const a = rnd() * 6.28, d = 70 + rnd() * 90; spawn(pX + Math.cos(a) * d * .8, pY + Math.sin(a) * d * 1.3); }
}
function setCam() { camX = Math.round(pX - LW / 2); camY = Math.round(pY - 150); }
function spawn(x, y) {
  if (x === undefined) {
    const s = Math.floor(rnd() * 4);
    x = s === 0 ? camX - 10 : s === 1 ? camX + LW + 10 : camX + rnd() * LW;
    y = s === 2 ? camY - 10 : s === 3 ? camY + LH + 10 : camY + rnd() * LH;
  }
  const r = rnd(), type = r < .38 ? 'fear' : r < .6 ? 'strife' : r < .82 ? 'lies' : 'sleep';
  enemies.push({ id: enemyId++, type, x, y, hp: TYPES[type].hp, ph: rnd() * 6.28, flash: 0, cd: 0, ring: -1, burst: -1 });
}
function burst(x, y, n, c1, c2, up) {
  for (let i = 0; i < n; i++) { const a = rnd() * 6.28, s = 10 + rnd() * 30; parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s * .7 - (up || 0), life: .5 + rnd() * .6, max: 1.1, c1, c2, g: -12 }); }
}
function hurt(e, d) {
  e.hp -= d; e.flash = .12;
  if (e.hp <= 0 && !e.dead) {
    e.dead = 1; burst(e.x, e.y, fever >= 0 ? 8 : 10, fever >= 0 ? P.gold : P.vL, fever >= 0 ? P.flame : P.gold, 14);
    if (gems.length < 70) gems.push({ x: e.x, y: e.y, t: 0 });
    if (fever >= 0) { feverKills++; if (feverKills % 10 === 0) { feverLen += .5; pops.push({ t: 0 }); } }
  }
}
function nearestEnemy(x, y, max) { let best = null, bd = max; for (const e of enemies) { if (e.dead) continue; const d = Math.hypot(e.x - x, e.y - y); if (d < bd) { bd = d; best = e; } } return best; }
function barriers() {
  const out = [], cyc = (T % 4.6) / 4.6;
  const up = fever >= 0 ? 1 : cyc < .07 ? cyc / .07 : cyc < .8 ? 1 : cyc < .87 ? 1 - (cyc - .8) / .07 : 0;
  if (up <= 0) return out;
  for (let k = 0; k < 4; k++) { const a = T * .35 + k * Math.PI / 2 + .4; out.push({ x: pX + Math.cos(a) * 36, y: pY + 4 + Math.sin(a) * 38, h: Math.round(up * 7) }); }
  return out;
}
const tap = (x, y) => taps.push({ x, y, t: 0 });

// ---------- update ----------
function step(dt) {
  U += dt; flash = Math.max(0, flash - dt * 1.8);
  for (const t of taps) t.t += dt; taps = taps.filter(t => t.t < .7);
  if (mode === 'play') updatePlay(dt);
  else if (mode === 'card') {
    cardT += dt;
    if (cardT >= 1.8 && cardT - dt < 1.8) tap(90, cardRect(0).y + 17);
    if (cardT >= 2.9 && cardT - dt < 2.9) tap(90, cardRect(0).y + 17);
    if (cardT >= 3.6) { mode = 'play'; lv++; xp = 0; silasLv3 = 1; lvPop = 1.5; }
  } else {
    eggT += dt;
    if (eggT >= 13.4 && eggT - dt < 13.4) tap(90, 247);
    if (eggT >= 15) reset();
  }
}
function updatePlay(dt) {
  T += dt; playT += dt; clock += dt; lvPop = Math.max(0, lvPop - dt); invT = Math.max(0, invT - dt);
  const F = fever >= 0, decline = playT > 42 && !F;
  // simulated floating joystick
  const ahead = pX + 50, ang = Math.atan2(roadY(ahead) - pY + 14 * Math.sin(T * .3), 50) + Math.sin(T * .5) * .6;
  let mag = Math.sin(T * .23) > .85 || decline ? 0 : .55 + .35 * Math.sin(T * .37);
  joyOn = !(btn >= 1.2);
  if (!joyOn) mag = 0;
  jx += (Math.cos(ang) * mag - jx) * Math.min(1, dt * 4); jy += (Math.sin(ang) * mag - jy) * Math.min(1, dt * 4);
  pX += jx * 24 * dt; pY += jy * 24 * dt; setCam();
  let scattered = 0;
  for (const c of CH) {
    if (c.id === 'paul') { c.x = pX; c.y = pY; continue; }
    c.vx += (-14 * c.ox - 6 * c.vx) * dt; c.vy += (-14 * c.oy - 6 * c.vy) * dt; c.ox += c.vx * dt; c.oy += c.vy * dt;
    const k = Math.min(1, dt * 5);
    c.bx += (pX + c.home[0] + Math.sin(T * .7 + c.i * 1.7) * 2.5 - c.bx) * k; c.by += (pY + c.home[1] + Math.cos(T * .9 + c.i * 1.3) * 1.6 - c.by) * k;
    c.x = c.bx + c.ox; c.y = c.by + c.oy;
    if (Math.hypot(c.ox, c.oy) > 5) scattered++;
    c.alert = Math.max(0, c.alert - dt); c.zz = Math.max(0, c.zz - dt);
  }
  const tim = C('tim'), sil = C('silas'), luke = C('luke'), spd = F ? 2 : 1;
  for (const c of CH) c.cd -= dt * spd;
  if (tim.cd <= 0) { const e = nearestEnemy(tim.x, tim.y, 110); if (e) { bolts.push({ x: tim.x, y: tim.y - 8, t: e, life: 1.2 }); tim.cd = .6; } }
  if (sil.cd <= 0) {
    rings.push({ x: sil.x, y: sil.y - 6, r: 4, dir: 1, id: Math.random(), fire: F }); sil.cd = 2.4;
    for (let i = 0; i < 2; i++) parts.push({ x: sil.x + (i ? 4 : -4), y: sil.y - 14, vx: i ? 6 : -6, vy: -14, life: 1.2, max: 1.2, img: note, g: 0 });
  }
  if (luke.cd <= 0) { luke.cd = 3.2; if (!decline) { for (const c of CH) heals.push({ c, t: 0 }); hp = Math.min(1, hp + .15); if (F) invT = .45; } }
  for (const b of bolts) {
    const tx = b.t.x, ty = b.t.y, d = Math.hypot(tx - b.x, ty - b.y) || 1;
    b.x += (tx - b.x) / d * 160 * dt; b.y += (ty - b.y) / d * 160 * dt; b.life -= dt;
    if (F) { if (rnd() < .5) embers.push({ x: b.x, y: b.y, life: .9 }); }
    else if (rnd() < .6) parts.push({ x: b.x, y: b.y, vx: 0, vy: 0, life: .2, max: .3, c1: P.gold, c2: P.flame, g: 0 });
    if (d < 4 || b.t.dead) { if (!b.t.dead) { hurt(b.t, F ? 2 : 1); burst(b.x, b.y, 4, P.cream, P.gold); } b.life = 0; }
  }
  bolts = bolts.filter(b => b.life > 0);
  for (const m of embers) { m.life -= dt; for (const e of enemies) if (!e.dead && Math.abs(e.x - m.x) < 4 && Math.abs(e.y - m.y) < 4) { hurt(e, 1); m.life = 0; break; } }
  embers = embers.filter(m => m.life > 0);
  const RMAX = 50;
  for (const r of rings) {
    r.r += 55 * dt * r.dir;
    if (r.dir > 0 && r.r >= RMAX) { if (silasLv3) { r.dir = -1; r.id = Math.random(); } else r.dead = 1; }
    if (r.r <= 2) r.dead = 1;
    for (const e of enemies) if (!e.dead && e.ring !== r.id && Math.abs(Math.hypot(e.x - r.x, e.y - r.y) - r.r) < 4) { e.ring = r.id; hurt(e, r.fire ? 2 : 1); }
  }
  rings = rings.filter(r => !r.dead);
  heals.forEach(h => h.t += dt); heals = heals.filter(h => h.t < 1);
  const bars = barriers();
  for (const e of enemies) {
    if (e.dead) continue;
    e.flash = Math.max(0, e.flash - dt); e.cd = Math.max(0, e.cd - dt);
    let tgt = C('paul');

  { name: '西拉 Lv3', tag: '詩歌', fx: '聲波往回收縮，打兩次', icon: 'silas' },
  { name: '喜樂', tag: '詩歌', fx: '範圍攻擊變大', icon: 'joy' },
  { name: '亞波羅', tag: '講道', fx: '直線光束貫穿', icon: 'apollos' }
];
function cardRect(i) {
  const k = Math.max(0, Math.min(1, (cardT - i * .1) / .35)), ease = 1 - (1 - k) * (1 - k), sel = i === 0 && cardT >= 1.8;
  const r = { x: 10, y: 150 + i * 40 + Math.round((1 - ease) * 200), w: 160, h: 34 };
  if (sel) { r.x -= 3; r.y -= 2; r.w += 6; r.h += 4; }
  return r;
}
function drawCardsLow() {
  L.fillStyle = 'rgba(12,8,18,.72)'; L.fillRect(0, 0, LW, LH);
  CARDS.forEach((c, i) => {
    const r = cardRect(i), sel = i === 0 && cardT >= 1.8, conf = i === 0 && cardT >= 2.9;
    R(r.x, r.y, r.w, r.h, '#0b080d'); R(r.x + 1, r.y + 1, r.w - 2, r.h - 2, sel ? P.gold : P.bronze);
    R(r.x + 2, r.y + 2, r.w - 4, r.h - 4, conf && Math.floor(U * 12) % 2 ? '#5a4420' : sel ? '#3a2a40' : P.panel);
    R(r.x + 5, r.y + 6, r.h - 12 + 4, r.h - 12, '#140c1a');
    const ix = r.x + 8, iy = r.y + Math.round(r.h / 2) - 6;
    if (c.icon === 'silas') { L.drawImage(C('silas').spr, ix, iy); L.drawImage(note, ix + 10, iy + 1); }
    else if (c.icon === 'joy') L.drawImage(joyIcon, ix + 1, iy + 1);
    else { L.drawImage(apollos, ix, iy); R(ix + 10, iy + 6, 7, 1, P.gold); R(ix + 10, iy + 5, 5, 1, P.cream); }
    R(r.x + r.w - 33, r.y + 5, 28, 10, c.tag === '詩歌' ? '#6a4a14' : '#1f4a5e');
    R(r.x + r.w - 33, r.y + 5, 28, 1, c.tag === '詩歌' ? P.gold : P.sky);
  });
  const by = 274 + Math.round(Math.max(0, .5 - cardT) * 200);
  panel(10, by, 76, 20); panel(94, by, 76, 20);
}
function drawCardsText() {
  txt('升級！', 90, 124, 10, P.gold, 'center'); txt('點一下放大，再點一下確認', 90, 139, 5, P.muted || '#cbb995', 'center');
  CARDS.forEach((c, i) => {
    const r = cardRect(i);
    txt(c.name, r.x + 30, r.y + 11, 6.5, P.ink); txt(c.fx, r.x + 30, r.y + 24, 5.2, '#d9c7a0');
    txt('【' + c.tag + '】', r.x + r.w - 19, r.y + 10, 4.4, c.tag === '詩歌' ? P.gold : P.sky, 'center');
  });
  const by = 274 + Math.max(0, .5 - cardT) * 200;
  txt('重抽 (3)', 48, by + 10, 6, P.ink, 'center'); txt('跳過', 132, by + 10, 6, '#cbb995', 'center');
}
function drawHudLow() {
  const F = fever >= 0;
  panel(3, 3, 58, 17); R(20, 13, 38, 4, '#0b080d'); R(21, 14, Math.round(36 * Math.min(1, xp / 40)), 2, P.sky);
  panel(70, 3, 40, 14);
  panel(163, 3, 14, 14); R(167, 7, 2, 6, P.ink); R(171, 7, 2, 6, P.ink);
  if (F) { panel(54, 19, 72, 15); const left = 1 - fever / feverLen; R(57, 31, Math.round(66 * left), 1, P.gold); }
  if (mode === 'egg') return;
  panel(12, 206, 156, 16);
  R(58, 210, 106, 8, '#0b080d');
  const mw = F ? Math.round(104 * (1 - fever / feverLen)) : Math.round(104 * meter);
  for (let x = 0; x < mw; x++) R(59 + x, 211, 1, 6, x % 8 === 7 ? '#c45a14' : (F || x > 52) ? P.gold : P.flame);
  if (mw) R(59, 211, mw, 1, P.cream);
  if ((meter >= 1 || F) && Math.floor(U * 6) % 2) { R(57, 209, 108, 1, P.cream); R(57, 218, 108, 1, P.cream); }
  if (joyOn && mode === 'play') {
    L.fillStyle = 'rgba(255,244,194,.08)'; L.beginPath(); L.arc(JOY.x, JOY.y, JOY.r, 0, 6.29); L.fill();
    dotRing(JOY.x, JOY.y, JOY.r, 1, 'rgba(255,244,194,.55)', 3, 0);
    const kx = Math.round(JOY.x + jx * 11), ky = Math.round(JOY.y + jy * 11);
    L.fillStyle = 'rgba(255,244,194,.45)'; L.beginPath(); L.arc(kx, ky, 6, 0, 6.29); L.fill();
    dotRing(kx, ky, 6, 1, 'rgba(255,255,255,.75)', 2, 0);
  }
  if (btn >= 0) {
    const k = Math.min(1, btn / .3), s = Math.round(14 * k), pul = Math.sin(U * 6) * 2;
    for (let r = s + 8 + pul; r > s; r -= 2) dotRing(BTN.x, BTN.y, r, 1, `rgba(255,170,40,${(.6 - (r - s) / 20).toFixed(2)})`, 2, U);
    L.fillStyle = '#0b080d'; L.beginPath(); L.arc(BTN.x, BTN.y, s + 1, 0, 6.29); L.fill();
    L.fillStyle = btnTapped ? P.gold : '#c4421a'; L.beginPath(); L.arc(BTN.x, BTN.y, s, 0, 6.29); L.fill();
    L.fillStyle = btnTapped ? P.cream : P.flame; L.beginPath(); L.arc(BTN.x, BTN.y - 1, s - 3, 0, 6.29); L.fill();
    if (k >= 1) L.drawImage(flame, 0, 0, 5, 7, BTN.x - 5, BTN.y - 9 + (Math.floor(U * 8) % 2), 10, 14);
  }
}
function drawTaps() {
  for (const t of taps) {
    if (t.t < .35) { L.fillStyle = 'rgba(255,255,255,.35)'; L.beginPath(); L.arc(t.x + 2, t.y + 3, 7, 0, 6.29); L.fill(); }
    dotRing(t.x, t.y, 4 + t.t * 30, 1, `rgba(255,255,255,${(1 - t.t / .7).toFixed(2)})`, 2, 0);
  }
}
function txt(s, lx, ly, size, color, align, out) {
  const S = W / LW, px = Math.max(size * S, (size < 6 ? 10 : 11) * DPR);
  D.font = `${Math.round(px)}px "DotGothic16","Noto Sans TC",sans-serif`; D.textAlign = align || 'left'; D.textBaseline = 'middle';
  const x = Math.round(lx * S), y = Math.round(ly * S), o = Math.max(1, Math.round(S * .4));
  D.fillStyle = out || '#140c10'; for (const [dx, dy] of [[-o, 0], [o, 0], [0, -o], [0, o], [o, o]]) D.fillText(s, x + dx, y + dy);
  D.fillStyle = color; D.fillText(s, x, y);
}
const fmt = c => String(Math.floor(c / 60)).padStart(2, '0') + ':' + String(Math.floor(c % 60)).padStart(2, '0');
function drawHudText() {
  const F = fever >= 0;
  txt('Lv.' + lv, 7, 9, 6, P.ink); txt('XP', 7, 15.5, 4.2, P.sky);
  txt(fmt(mode === 'egg' ? eggClock : clock), 90, 10, 6.5, P.cream, 'center');
  if (F) txt('FEVER ×' + feverKills, 90, 26, 6.5, P.gold, 'center', '#5a1a08');
  for (const p of pops) { D.globalAlpha = 1 - p.t; txt('+0.5s', 140, 26 - p.t * 10, 5.5, P.heal, 'center'); D.globalAlpha = 1; }
  if (mode === 'egg') return;
  if (mode === 'play') {
    for (const c of CH) { D.globalAlpha = .9; txt(c.name, c.x - camX, c.y - camY + (c.id === 'paul' ? 8 : 4.5), 4.2, c.id === 'paul' ? P.gold : P.ink, 'center'); D.globalAlpha = 1; }
    if (lvPop > 0 && Math.floor(lvPop * 8) % 2) txt('西拉 Lv3！', pX - camX, pY - camY - 30, 5.5, P.sky, 'center');
  }
  if (mode === 'card') return;
  txt(F ? 'FEVER' : '同心合意', 34, 214.5, 5.5, F || meter >= 1 ? P.gold : P.ink, 'center');
  if (btn >= .3) txt('五旬節', BTN.x, BTN.y + 21, 6.5, P.gold, 'center', '#5a1a08');
  txt('宣教之路 · 手機版', 176, 314, 4.2, 'rgba(244,234,210,.55)', 'right', 'rgba(0,0,0,0)');
  if (F && fever < 1.6) { D.globalAlpha = Math.min(1, (1.6 - fever) * 1.5); txt('五旬節！', 90, 64, 13, P.gold, 'center', '#5a1a08'); txt('有舌頭如火焰顯現（徒 2:3）', 90, 80, 5, P.cream, 'center'); D.globalAlpha = 1; }
}
function render() {
  drawWorld();
  if (mode === 'egg') eggFigure();
  drawHudLow();
  if (mode === 'card') drawCardsLow();
  drawTaps();
  if (flash > 0) { L.fillStyle = `rgba(255,244,194,${(flash * .7).toFixed(3)})`; L.fillRect(0, 0, LW, LH); }
  D.imageSmoothingEnabled = false; D.drawImage(low, 0, 0, W, H);
  drawHudText();
  if (mode === 'card') drawCardsText();
  if (mode === 'egg') eggText();
}

// ---------- boot ----------
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.round((cv.clientWidth || 405) * DPR); H = Math.round(W * 16 / 9);
  cv.width = W; cv.height = H; if (reduce) render();
}
reset();
const skip = +new URLSearchParams(location.search).get('t') || 0;
for (let t = 0; t < skip; t += 1 / 30) step(1 / 30);
new ResizeObserver(resize).observe(cv); resize();
if (reduce) {
  let n = 0; while (!(fever >= 3) && n++ < 3000) step(1 / 30);
  render(); if (document.fonts) document.fonts.ready.then(render);
} else {
  let last = 0;
  const loop = ts => { const dt = Math.min(.05, last ? (ts - last) / 1000 : 1 / 60); last = ts; step(dt); render(); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
</script>
