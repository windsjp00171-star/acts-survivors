<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>宣教之路 古卷風</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#241810;}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:12px;box-sizing:border-box;
    background:radial-gradient(ellipse at center,#3a2716 0%,#1d130b 100%);font-family:"Noto Serif TC",serif;}
  .wrap{width:min(960px,100%);}
  canvas{display:block;width:100%;aspect-ratio:16/9;border-radius:4px;
    box-shadow:0 14px 40px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.45);}
</style>
</head>
<body>
<div class="wrap"><canvas id="c" aria-label="宣教之路 古卷風 美術風格示意：保羅與同伴在古卷地圖上對抗墨跡般的黑暗勢力"></canvas></div>
<script>
(() => {
'use strict';
const W = 960, H = 540, TAU = Math.PI * 2;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FONT = '"Noto Serif TC","Songti TC","PMingLiU",serif';
const INK = '#2b1a0c', SEP = '#5b3b1f', RED = '#9c3b2a', PAPER = '#f0e2c2';
const hs = n => { n = Math.sin(n * 127.1 + 311.7) * 43758.5453; return n - Math.floor(n); };
const rnd = (a, b) => a + Math.random() * (b - a);
let boil = 0, time = 0;
const J = (s, a) => (hs(s * 1.731 + boil * 17.13) - .5) * 2 * a;

/* ---------- ink & wash primitives ---------- */
function trace(pts, seed, amt, close) {
  const q = pts.map((p, i) => [p[0] + J(seed + i * 3.1, amt), p[1] + J(seed + i * 5.7 + .3, amt)]);
  const n = q.length;
  ctx.beginPath();
  if (close) {
    ctx.moveTo((q[n - 1][0] + q[0][0]) / 2, (q[n - 1][1] + q[0][1]) / 2);
    for (let i = 0; i < n; i++) { const a = q[i], b = q[(i + 1) % n]; ctx.quadraticCurveTo(a[0], a[1], (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); }
    ctx.closePath();
  } else {
    ctx.moveTo(q[0][0], q[0][1]);
    for (let i = 1; i < n - 1; i++) { const a = q[i], b = q[i + 1]; ctx.quadraticCurveTo(a[0], a[1], (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); }
    ctx.lineTo(q[n - 1][0], q[n - 1][1]);
  }
}
function ink(w, col, a) { ctx.lineWidth = w; ctx.strokeStyle = col || INK; ctx.globalAlpha = a == null ? .88 : a; ctx.stroke(); ctx.globalAlpha = 1; }
function wash(col, a) {
  ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = col; ctx.strokeStyle = col;
  ctx.globalAlpha = a; ctx.fill(); ctx.globalAlpha = a * .45; ctx.lineWidth = 2.4; ctx.stroke(); ctx.restore();
}
function blob(cx, cy, rx, ry, n, seed, irr) {
  const p = [];
  for (let i = 0; i < n; i++) { const a = i / n * TAU, r = 1 + (hs(seed + i * 7.3) - .5) * irr; p.push([cx + Math.cos(a) * rx * r, cy + Math.sin(a) * ry * r]); }
  return p;
}
function goldGrad(x0, y0, x1, y1) {
  const g = ctx.createLinearGradient(x0, y0, x1, y1);
  g.addColorStop(0, '#94661b'); g.addColorStop(.3, '#f5da86'); g.addColorStop(.5, '#cf9d3c');
  g.addColorStop(.75, '#fff0bd'); g.addColorStop(1, '#a5721f'); return g;
}
function dot(x, y, r, col, a) { ctx.globalAlpha = a; ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); ctx.globalAlpha = 1; }

/* ---------- paper & overlays (pre-rendered) ---------- */
let paper, grain;
function mk() {
  const c = document.createElement('canvas'); c.width = cv.width; c.height = cv.height;
  const g = c.getContext('2d'); g.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0); return [c, g];
}
function buildPaper() {
  let g; [paper, g] = mk();
  const gr = g.createRadialGradient(W * .5, H * .45, 40, W * .5, H * .5, W * .7);
  gr.addColorStop(0, '#f4e7c8'); gr.addColorStop(1, '#dcc292'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
  for (let y = 0; y < H; y += 6 + hs(y) * 7) { g.fillStyle = `rgba(${hs(y + 1) > .5 ? '255,248,226' : '150,108,58'},${.035 + hs(y + 2) * .05})`; g.fillRect(0, y, W, 2 + hs(y + 3) * 4); }
  for (let x = 0; x < W; x += 9 + hs(x + 9) * 12) { g.fillStyle = `rgba(140,100,55,${.015 + hs(x) * .03})`; g.fillRect(x, 0, 1.5 + hs(x + 4) * 3, H); }
  for (let i = 0; i < 16; i++) {
    const x = hs(i * 3.3) * W, y = hs(i * 7.1) * H, r = 40 + hs(i * 1.9) * 150, s = g.createRadialGradient(x, y, r * .2, x, y, r);
    s.addColorStop(0, 'rgba(160,110,50,0)'); s.addColorStop(.82, `rgba(145,96,42,${.05 + hs(i) * .07})`); s.addColorStop(1, 'rgba(150,100,45,0)');
    g.fillStyle = s; g.fillRect(0, 0, W, H);
  }
  for (let i = 0; i < 1500; i++) {
    const x = hs(i * .917) * W, y = hs(i * 1.31 + 5) * H, l = 6 + hs(i * 2.7) * 30, a = (hs(i * 3.9) - .5) * .6;
    g.strokeStyle = hs(i * 4.4) > .4 ? `rgba(110,75,35,${.05 + hs(i) * .08})` : `rgba(255,250,232,${.1 + hs(i) * .16})`;
    g.lineWidth = .4 + hs(i * 5.1) * .6; g.beginPath(); g.moveTo(x, y);
    g.quadraticCurveTo(x + l * .5, y + Math.sin(a) * l * .5 + 2, x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }
  for (let i = 0; i < 70; i++) { g.fillStyle = `rgba(80,50,20,${.15 + hs(i * 8) * .3})`; g.beginPath(); g.arc(hs(i * 2.2) * W, hs(i * 6.6) * H, .4 + hs(i) * 1.1, 0, TAU); g.fill(); }

  [grain, g] = mk();
  g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
  const v = g.createRadialGradient(W / 2, H / 2, H * .38, W / 2, H / 2, W * .62);
  v.addColorStop(0, 'rgba(255,255,255,0)'); v.addColorStop(.75, 'rgba(225,190,140,.35)'); v.addColorStop(1, 'rgba(140,85,35,.85)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 110; i++) {  // scorched, uneven edges
    const t = hs(i * 1.7), side = i % 4, x = side < 2 ? t * W : (side === 2 ? 0 : W), y = side < 2 ? (side ? H : 0) : t * H;
    const r = 18 + hs(i * 3.1) * 55, s = g.createRadialGradient(x, y, 0, x, y, r);
    s.addColorStop(0, `rgba(110,60,22,${.25 + hs(i) * .3})`); s.addColorStop(1, 'rgba(110,60,22,0)'); g.fillStyle = s; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  const s2 = g.createRadialGradient(790, 405, 30, 790, 405, 52);  // a tea-ring stain
  s2.addColorStop(0, 'rgba(255,255,255,0)'); s2.addColorStop(.85, 'rgba(190,140,80,.25)'); s2.addColorStop(.92, 'rgba(160,105,50,.35)'); s2.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = s2; g.fillRect(730, 345, 120, 120);
  const im = g.getImageData(0, 0, grain.width, grain.height), d = im.data;
  for (let i = 0; i < d.length; i += 4) { const n = (Math.random() - .5) * 20; d[i] += n; d[i + 1] += n; d[i + 2] += n * 1.1; }
  g.putImageData(im, 0, 0);
  drawBorder(g); drawCompass(g);
}
function drawBorder(g) {
  const m = 12, b = 11;
  g.save(); g.lineJoin = 'round'; g.lineCap = 'round';
  g.fillStyle = 'rgba(200,140,70,.35)';
  g.fillRect(m, m, W - 2 * m, b); g.fillRect(m, H - m - b, W - 2 * m, b); g.fillRect(m, m + b, b, H - 2 * (m + b)); g.fillRect(W - m - b, m + b, b, H - 2 * (m + b));
  g.strokeStyle = 'rgba(70,38,16,.85)'; g.lineWidth = 1.25;
  const L = (pts, s) => { g.beginPath(); pts.forEach((p, i) => { const x = p[0] + (hs(s + i) - .5) * .9, y = p[1] + (hs(s + i + .5) - .5) * .9; i ? g.lineTo(x, y) : g.moveTo(x, y); }); g.stroke(); };
  L([[m, m], [W - m, m], [W - m, H - m], [m, H - m], [m, m]], 1);
  L([[m + b, m + b], [W - m - b, m + b], [W - m - b, H - m - b], [m + b, H - m - b], [m + b, m + b]], 2);
  const side = (len, tf, s) => {
    const u = 14, n = Math.floor(len / u), off = (len - n * u) / 2;
    for (let k = 0; k < n; k++) { const o = off + k * u; L([[o + 2, b - 1], [o + 2, 2.2], [o + 11, 2.2], [o + 11, b - 3.4], [o + 5.6, b - 3.4], [o + 5.6, 5.4]].map(tf), s + k * 9); }
  };
  const In = W - 2 * (m + b), Iv = H - 2 * (m + b);
  side(In, p => [m + b + p[0], m + p[1]], 10);
  side(In, p => [W - m - b - p[0], H - m - p[1]], 20);
  side(Iv, p => [m + p[1], H - m - b - p[0]], 30);
  side(Iv, p => [W - m - p[1], m + b + p[0]], 40);
  for (const [x, y] of [[m, m], [W - m - b, m], [m, H - m - b], [W - m - b, H - m - b]]) { g.strokeRect(x + 2.5, y + 2.5, b - 5, b - 5); g.fillStyle = 'rgba(156,59,42,.7)'; g.fillRect(x + 4, y + 4, b - 8, b - 8); }
  g.restore();
}
function drawCompass(g) {
  g.save(); g.translate(86, H - 116); g.globalAlpha = .55; g.strokeStyle = SEP; g.lineWidth = .9;
  g.beginPath(); g.arc(0, 0, 34, 0, TAU); g.stroke(); g.beginPath(); g.arc(0, 0, 30, 0, TAU); g.stroke();
  for (let i = 0; i < 32; i++) { const a = i / 32 * TAU, r2 = i % 4 ? 32 : 34; g.beginPath(); g.moveTo(Math.cos(a) * 30, Math.sin(a) * 30); g.lineTo(Math.cos(a) * r2, Math.sin(a) * r2); g.stroke(); }
  for (let i = 0; i < 8; i++) {
    const a = i / 8 * TAU - Math.PI / 2, Lr = i % 2 ? 22 : 44, w = i % 2 ? 4 : 6.5, tx = Math.cos(a) * Lr, ty = Math.sin(a) * Lr;
    const lx = Math.cos(a - Math.PI / 2) * w, ly = Math.sin(a - Math.PI / 2) * w;
    g.beginPath(); g.moveTo(tx, ty); g.lineTo(0, 0); g.lineTo(lx, ly); g.closePath(); g.fillStyle = i ? SEP : RED; g.fill();
    g.beginPath(); g.moveTo(tx, ty); g.lineTo(0, 0); g.lineTo(-lx, -ly); g.closePath(); g.fillStyle = '#f3e3bf'; g.fill(); g.stroke();
  }
  g.font = `700 13px ${FONT}`; g.fillStyle = RED; g.textAlign = 'center'; g.fillText('北', 0, -50);
  g.restore();
}

/* ---------- world ---------- */
const roadY = x => Math.sin(x / 340) * 60 + Math.sin(x / 130) * 12;
const P = { x: 0, y: 0 }, cam = { x: 0, y: 0 };
const decoCache = {}, TILE = 230;
function decoFor(i) {
  if (decoCache[i]) return decoCache[i];
  const out = [];
  for (let k = 0; k < 7; k++) {
    const s = i * 31.7 + k * 7.13, r = hs(s + 3), t = r < .4 ? 'tree' : r < .68 ? 'rock' : 'tuft';
    const x = i * TILE + hs(s) * TILE, side = hs(s + 1) > .5 ? 1 : -1, d = (t === 'tree' ? 82 : 52) + hs(s + 2) * 250;
    out.push({ x, y: roadY(x) + side * d, s, t, sz: .8 + hs(s + 4) * .6 });
  }
  if (i % 3 === 0) { const x = i * TILE + 60; out.push({ x, y: roadY(x) + 46, s: i, t: 'mile', n: i / 3 }); }
  return decoCache[i] = out;
}
function contours(x0, x1) {
  for (const c of [-1, 1]) for (let k = 1; k <= 3; k++) {
    const pts = [];
    for (let x = Math.floor(x0 / 30) * 30; x <= x1; x += 30) pts.push([x, roadY(x) + c * (100 + k * 75) + Math.sin(x / 90 + k * 2) * 16]);
    trace(pts, k * 13 + c, .8, false); ink(.8, SEP, .16);
  }
}
function road(x0, x1) {
  const st = 24, a0 = Math.floor(x0 / st) * st, top = [], bot = [];
  for (let x = a0; x <= x1 + st; x += st) { top.push([x, roadY(x) - 30 - hs(x * .1) * 6]); bot.push([x, roadY(x) + 30 + hs(x * .13) * 6]); }
  ctx.beginPath(); top.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
  for (let i = bot.length - 1; i >= 0; i--) ctx.lineTo(bot[i][0], bot[i][1]);
  ctx.closePath(); wash('#c7995a', .3);
  for (const E of [top, bot]) for (let i = 0; i < E.length - 1; i++) {
    const sx = E[i][0]; if (hs(sx * .37 + (E === top ? 1 : 2)) < .2) continue;
    trace([E[i], [(E[i][0] + E[i + 1][0]) / 2, (E[i][1] + E[i + 1][1]) / 2 + 1], E[i + 1]], sx, .9, false); ink(1.2, INK, .7);
  }
  for (const off of [-11, 11]) for (let x = a0; x < x1; x += 34) { trace([[x, roadY(x) + off], [x + 16, roadY(x + 16) + off]], x + off, .7, false); ink(.7, SEP, .35); }
  for (let x = a0; x < x1; x += 8) if (hs(x * .71) > .55) dot(x + hs(x) * 6, roadY(x) + (hs(x * 1.3) - .5) * 54, .7 + hs(x * 2) * .9, SEP, .35);
  for (let x = Math.floor(x0 / 11) * 11; x < x1; x += 11) dot(x, roadY(x) + 3 + J(x, .5), 1.35, RED, .68);  // the travel route
}
function tree(o) {
  const { x, y, s, sz } = o, R = 22 * sz, cy = y - 14 * sz;
  trace(blob(x + 9, y + 5, R * 1.05, R * .55, 10, s, .3), s, 0, true); wash('#6b5636', .2);
  trace([[x - 2, y + 4], [x - 1, y - 5], [x + 1, y - 10]], s + 1, .5, false); ink(2.2, SEP, .85);
  for (let c = 0; c < 4; c++) {
    const a = hs(s + c) * TAU, d = c ? R * .45 : 0, px = x + Math.cos(a) * d, py = cy + Math.sin(a) * d * .7;
    const p = blob(px, py, R * .62, R * .5, 11, s + c * 3, .35);
    trace(p.map(q => [q[0] + 1.5, q[1] - 1]), s + c * 9 + 40, .6, true); wash(c % 2 ? '#8f9656' : '#6c7943', .48);
    trace(p, s + c * 9, .8, true); ink(1.05, INK, .72);
  }
  for (let k = 0; k < 8; k++) {
    const a = hs(s + k * 2.2) * TAU, d = hs(s + k * 3.3) * R * .8, lx = x + Math.cos(a) * d, ly = cy + Math.sin(a) * d * .6;
    ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx + 3 + J(s + k, .5), ly - 2); ink(.8, INK, .45);
    if (k % 3 === 0) dot(lx + 2, ly + 2, 1.2, '#3c3a26', .8);
  }
}
function rock(o) {
  const { x, y, s, sz } = o, p = blob(x, y, 11 * sz, 7 * sz, 7, s, .5);
  trace(blob(x + 3, y + 3, 11 * sz, 6 * sz, 7, s, .4), s, 0, true); wash('#6b5636', .16);
  trace(p, s + 5, .4, true); wash('#a19682', .5); trace(p, s, .7, true); ink(1.15);
  for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.moveTo(x + 2 + k * 3, y + 4 * sz); ctx.lineTo(x + 5 + k * 3, y + 1); ink(.6, INK, .5); }
}
function tuft(o) {
  for (let k = 0; k < 4; k++) { const bx = o.x + (hs(o.s + k) - .5) * 18, by = o.y + (hs(o.s + k * 2) - .5) * 8;
    trace([[bx - 3, by - 5], [bx, by], [bx + 3, by - 6]], o.s + k, .4, false); ink(.8, '#4b4a2a', .55); }
}
function mile(o) {
  const { x, y, s } = o;
  ctx.beginPath(); ctx.ellipse(x + 4, y + 1, 9, 3.5, 0, 0, TAU); wash('#5b3b1f', .2);
  const p = [[x - 6, y], [x - 6, y - 19], [x - 3, y - 24], [x + 3, y - 24], [x + 6, y - 19], [x + 6, y]];
  trace(p, s + 2, .4, true); wash('#b8ab92', .6); trace(p, s, .6, true); ink(1.2);
  ctx.font = `700 7px ${FONT}`; ctx.fillStyle = INK; ctx.textAlign = 'center';
  ctx.fillText('Μ', x, y - 13); ctx.fillText('ΑΒΓΔΕϚΖΗΘΙ'[o.n % 10 | 0] || 'Ι', x, y - 5);
}

/* ---------- the company ---------- */
const crew = [
  { id: 'paul', n: '保羅', robe: '#8a5a2b', sc: 1.25, ox: 0, oy: 0 },
  { id: 'barn', n: '巴拿巴', robe: '#6c7943', sc: 1.08, ox: -60, oy: -22, beard: 1 },
  { id: 'luke', n: '路加', robe: '#3e5372', sc: 1, ox: 56, oy: -30 },
  { id: 'silas', n: '西拉', robe: '#a3483a', sc: 1.05, ox: -50, oy: 42, beard: 1 },
  { id: 'tim', n: '提摩太', robe: '#c08a3e', sc: .88, ox: 60, oy: 36 },
  { id: 'pri', n: '百基拉 · 亞居拉', robe: '#4f6a8c', sc: .95, ox: -14, oy: -74, veil: 1 },
  { id: 'aq', n: '', robe: '#7a6533', sc: 1, ox: 14, oy: -70, beard: 1 },
];
crew.forEach((m, i) => Object.assign(m, { sc: m.sc * 1.15, ox: m.ox * 1.12, oy: m.oy * 1.12 }));
crew.forEach((m, i) => Object.assign(m, { x: 0, y: 0, sx: 0, sy: 0, vx: 0, vy: 0, ph: i * 1.9, fr: 0, cd: 0, t: rnd(0, 1), sh: 0 }));
const C = id => crew.find(m => m.id === id);
function figure(m) {
  const s = m.sc, x = m.x, y = m.y + Math.abs(Math.sin(time * 5 + m.ph)) * -1.2, st = m.ph * 10;
  ctx.beginPath(); ctx.ellipse(x + 2, m.y + 2, 9 * s, 3.8 * s, 0, 0, TAU); wash('#5b3b1f', .24);
  if (m.id === 'paul') { trace([[x + 9 * s, y + 1], [x + 9.5 * s, y - 16 * s], [x + 8.5 * s, y - 31 * s], [x + 11 * s, y - 34 * s], [x + 13 * s, y - 31 * s]], st + 30, .5, false); ink(1.7, SEP, .95); }
  const R = [[x - 7 * s, y], [x - 5.5 * s, y - 9 * s], [x - 3.5 * s, y - 15 * s], [x + 3.5 * s, y - 15 * s], [x + 5.5 * s, y - 9 * s], [x + 7 * s, y], [x + 2 * s, y + 2 * s], [x - 2 * s, y + 2 * s]];
  trace(R.map(q => [q[0] + 1.2, q[1] - .8]), st + 3, .7, true); wash(m.robe, .78);
  trace(R, st, .65, true); ink(1.25);
  trace([[x - 1, y - 13 * s], [x + s, y - 6 * s], [x, y + s]], st + 7, .5, false); ink(.7, INK, .45);
  if (m.id === 'paul') {
    trace([[x - 3.5 * s, y - 14 * s], [x + 1 * s, y - 7 * s], [x + 5 * s, y - 1 * s]], st + 9, .4, false); ink(2, RED, .55);
    const sx = x - 9 * s, sy = y - 10 * s; ctx.beginPath(); ctx.rect(sx - 2.5 * s, sy - 4 * s, 5 * s, 9 * s); wash('#efdcb0', .9); ink(1);
    ctx.beginPath(); ctx.moveTo(sx - 2.5 * s, sy); ctx.lineTo(sx + 2.5 * s, sy); ink(1.3, RED, .8);
  }
  if (m.id === 'luke') { ctx.beginPath(); ctx.rect(x + 4 * s, y - 7 * s, 5 * s, 4 * s); wash('#b58a4c', .8); ink(.9); }
  const hy = y - 19 * s;
  ctx.beginPath(); ctx.arc(x, hy, 4.3 * s, 0, TAU); wash('#d9a877', .85);
  if (m.veil) { trace([[x - 5.5 * s, hy + 5 * s], [x - 5 * s, hy - 3 * s], [x, hy - 6 * s], [x + 5 * s, hy - 3 * s], [x + 5.5 * s, hy + 5 * s]], st + 14, .5, false); wash(m.robe, .7); ink(1, INK, .8); }
